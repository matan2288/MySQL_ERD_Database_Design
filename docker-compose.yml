services:
  db:
    image: mysql:8.0
    container_name: mysql_erd_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: company_db
    ports:
      - "3306:3306"
    volumes:
      - ./init_database.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
